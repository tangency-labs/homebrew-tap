name: Bump SolidCraft

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cask to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/bump.sh
      - name: Audit and install
        run: |
          brew tap-new --no-git local/test >/dev/null
          tap=$(brew --repository local/test)
          mkdir -p "$tap/Casks"
          cp Casks/*.rb "$tap/Casks/"
          brew audit --cask --online local/test/solidcraft \
            $(git ls-files --others --exclude-standard Casks | sed -E "s|Casks/(.*)\.rb|local/test/\1|")
          brew install --cask local/test/solidcraft
          brew uninstall --cask local/test/solidcraft
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          version=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/solidcraft.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "solidcraft $version"
          git push
